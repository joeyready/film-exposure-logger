<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Logger — v0.2</title>
  <style>
    :root {
      --bg: #171717;
      --device: #242424;
      --screen: #050505;
      --text: #f2f2f2;
      --muted: #999;
      --button: #333;
      --button-active: #444;
      --accent: #d9d9d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101010;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(720px, 100%); }
    .title {
      text-align: center;
      margin-bottom: 16px;
    }
    .title h1 { margin: 0 0 4px; font-size: 20px; }
    .title p { margin: 0; color: var(--muted); font-size: 13px; }
    .device {
      background: var(--device);
      border: 1px solid #3b3b3b;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .oled {
      aspect-ratio: 2 / 1;
      background: var(--screen);
      border: 8px solid #111;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: "Courier New", monospace;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      box-shadow: inset 0 0 18px rgba(255,255,255,.04);
    }
    .oled-header, .oled-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
      font-size: clamp(10px, 2.2vw, 16px);
    }
    .oled-main {
      display: grid;
      place-items: center;
      text-align: center;
      font-size: clamp(13px, 3vw, 22px);
      line-height: 1.25;
    }
    .exposure { display: flex; gap: 18px; align-items: center; }
    .setting {
      display: block;
      padding: 3px 6px;
      border: 1px solid transparent;
      min-width: 86px;
    }
    .setting span { display: block; }
    .label { font-size: .65em; color: #aaa; }
    .setting.selected {
      color: #000;
      background: #f2f2f2;
      border-color: #f2f2f2;
    }
    .setting.selected .label { color: #333; }
    .setting.selected::after {
      content: " EDIT";
      display: block;
      font-size: 9px;
      line-height: 1;
      margin-top: 2px;
      letter-spacing: .08em;
    }
    .controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1.25fr;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      min-height: 54px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 3px 0 #111;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; background: var(--button-active); }
    .side {
      display: grid;
      gap: 10px;
      margin-left: 10px;
      grid-column: 6;
      grid-row: 1 / span 2;
    }
    .shot { min-height: 118px; }
    .nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 1.2fr;
      gap: 10px;
    }
    .subtle { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.5; }
    .feedback {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #1c1c1c;
      color: #cfcfcf;
      font-family: "Courier New", monospace;
      font-size: 12px;
      min-height: 42px;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      place-items: center;
      padding: 20px;
    }
    .modal.open { display: grid; }
    .panel {
      width: min(520px, 100%);
      background: #242424;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 20px;
    }
    .panel h2 { margin-top: 0; }
    .panel p { color: #bbb; font-size: 14px; }
    .panel button { width: 100%; margin-top: 8px; }
    @media (max-width: 560px) {
      body { padding: 10px; }
      .device { padding: 14px; border-radius: 18px; }
      .oled { border-width: 5px; }
      .controls { gap: 6px; }
      button { min-height: 48px; }
      .nav { gap: 6px; }
      .exposure { gap: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="title">
      <h1>Film Logger — Virtual Prototype</h1>
      <p>Version 0.2 · field selection prototype</p>
    </div>

    <section class="device" aria-label="Virtual film logger">
      <div class="oled" id="oled">
        <div class="oled-header">
          <span id="roll">ROLL 01</span>
          <span id="frame">FRAME 01/36</span>
        </div>
        <div class="oled-main">
          <div class="exposure">
            <div class="setting selected" id="shutterField">
              <span class="label">SHUTTER</span><span id="shutter">1/250</span>
            </div>
            <div class="setting" id="apertureField">
              <span class="label">APERTURE</span><span id="aperture">f/5.6</span>
            </div>
          </div>
        </div>
        <div class="oled-footer">
          <span id="film">Ilford HP5 · ISO 400</span>
          <span id="gps">GPS —</span>
        </div>
      </div>

      <div class="nav" style="margin-top:18px">
        <button data-action="left" aria-label="Left">←</button>
        <button data-action="right" aria-label="Right">→</button>
        <button data-action="up" aria-label="Up">↑</button>
        <button data-action="down" aria-label="Down">↓</button>
        <button data-action="select">SELECT</button>
      </div>
      <div style="margin-top:10px">
        <button class="shot" data-action="shot">SHOT</button>
      </div>

      <div class="feedback" id="feedback">READY — use the buttons to explore the prototype.</div>
      <div class="subtle">
v0.2 tests field selection and value editing.
        Nothing is saved or sent anywhere yet.
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="panel">
      <h2 id="modalTitle">Select</h2>
      <p id="modalText"></p>
      <button id="closeModal">CLOSE</button>
    </div>
  </div>

  <script>
    const state = {
      frame: 1,
      maxFrames: 36,
      shutter: ["1/30","1/60","1/125","1/250","1/500","1/1000"],
      shutterIndex: 3,
      aperture: ["f/2","f/2.8","f/4","f/5.6","f/8","f/11","f/16"],
      apertureIndex: 3,
      selected: "shutter"
    };

    const editableFields = ["shutter", "aperture"];

    const $ = id => document.getElementById(id);
    const feedback = $("feedback");

    function render() {
      $("frame").textContent = `FRAME ${String(state.frame).padStart(2,"0")}/${state.maxFrames}`;
      $("shutter").textContent = state.shutter[state.shutterIndex];
      $("aperture").textContent = state.aperture[state.apertureIndex];

      $("shutterField").classList.toggle("selected", state.selected === "shutter");
      $("apertureField").classList.toggle("selected", state.selected === "aperture");

      feedback.textContent = `READY — ${state.selected.toUpperCase()} selected. ↑/↓ changes value; ←/→ selects field.`;
    }

    function action(name) {
      if (name === "left" || name === "right") {
        const direction = name === "right" ? 1 : -1;
        const currentIndex = editableFields.indexOf(state.selected);
        state.selected = editableFields[
          (currentIndex + direction + editableFields.length) % editableFields.length
        ];
        render();
        return;
      }

      if (name === "up" || name === "down") {
        const direction = name === "up" ? 1 : -1;
        if (state.selected === "shutter") {
          state.shutterIndex = (state.shutterIndex + direction + state.shutter.length) % state.shutter.length;
        } else if (state.selected === "aperture") {
          state.apertureIndex = (state.apertureIndex + direction + state.aperture.length) % state.aperture.length;
        }
        render();
        return;
      }

      if (name === "select") {
        $("modalTitle").textContent = "SELECT";
        $("modalText").textContent =
          `Currently editing ${state.selected}. Use LEFT/RIGHT to choose a field, then UP/DOWN to change its value. The highlighted field is the one that will be edited.`;
        $("modal").classList.add("open");
        return;
      }

      if (name === "shot") {
        if (state.frame < state.maxFrames) {
          const loggedFrame = state.frame;
          state.frame++;
          feedback.textContent = `SHOT LOGGED — frame ${String(loggedFrame).padStart(2,"0")} · ${state.shutter[state.shutterIndex]} · ${state.aperture[state.apertureIndex]}`;
          $("frame").textContent = `FRAME ${String(state.frame).padStart(2,"0")}/${state.maxFrames}`;
        } else {
          feedback.textContent = "ROLL COMPLETE — no additional frame logged.";
        }
      }
    }

    document.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => action(btn.dataset.action));
    });

    $("closeModal").addEventListener("click", () => $("modal").classList.remove("open"));
    $("modal").addEventListener("click", e => {
      if (e.target === $("modal")) $("modal").classList.remove("open");
    });

    document.addEventListener("keydown", e => {
      const map = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
        Enter: "select",
        " ": "shot"
      };
      if (map[e.key]) {
        e.preventDefault();
        action(map[e.key]);
      }
    });

    render();
  </script>
</body>
</html>
